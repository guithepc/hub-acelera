<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Protótipo da home · Hub Acelera</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Martian+Mono:wght@300;400;600&family=Instrument+Sans:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --void: #04050d;
        --deep: #0a0d1c;
        --ink: #e9ecf5;
        --dim: #7b819a;
        --mint: #5cf2b0;
        --amber: #ffb547;
        --line: rgba(233, 236, 245, 0.09);
        --mx: 50%;
        --my: 50%;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        height: 100%;
        background: var(--void);
        color: var(--ink);
        font-family: "Instrument Sans", sans-serif;
        overflow: hidden;
      }
      .mono {
        font-family: "Martian Mono", monospace;
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }

      /* tela de entrada */
      #gate {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: grid;
        place-items: center;
        background:
          linear-gradient(var(--line) 1px, transparent 1px) 0 0 / 100% 48px,
          linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0 / 48px 100%,
          var(--void);
        transition: clip-path 0.9s cubic-bezier(0.7, 0, 0.2, 1);
        clip-path: inset(0 0 0 0);
      }
      #gate.open {
        clip-path: inset(0 0 100% 0);
        pointer-events: none;
      }
      .gate-box {
        text-align: center;
        display: grid;
        gap: 22px;
        justify-items: center;
      }
      #count {
        font-family: "Unbounded", sans-serif;
        font-weight: 900;
        font-size: clamp(96px, 22vw, 240px);
        line-height: 0.85;
        color: var(--amber);
        font-variant-numeric: tabular-nums;
      }
      #ignite {
        border: 0;
        border-radius: 999px;
        padding: 16px 34px;
        background: var(--amber);
        color: #1a1002;
        box-shadow: 0 0 0 6px rgba(255, 181, 71, 0.18);
      }
      #ignite:hover {
        box-shadow: 0 0 0 10px rgba(255, 181, 71, 0.22);
      }
      #skip {
        background: none;
        border: 0;
        color: var(--dim);
      }

      /* hero comum */
      #hero {
        position: fixed;
        inset: 0;
        display: grid;
        grid-template-rows: auto 1fr auto;
        padding: clamp(18px, 3vw, 36px);
      }
      .top {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        color: var(--dim);
        position: relative;
        z-index: 5;
      }
      .top b {
        color: var(--mint);
        font-weight: 400;
      }
      .mid {
        align-self: center;
        position: relative;
        z-index: 5;
        pointer-events: none;
      }
      h1 {
        font-family: "Unbounded", sans-serif;
        font-weight: 900;
        font-size: clamp(54px, 13.5vw, 220px);
        line-height: 0.84;
        letter-spacing: -0.04em;
      }
      h1 span {
        color: var(--mint);
      }
      .lede {
        margin-top: clamp(16px, 2.4vw, 32px);
        max-width: 30ch;
        font-size: clamp(17px, 1.7vw, 24px);
        line-height: 1.35;
        color: #c4c9da;
      }
      .cta {
        margin-top: 26px;
        display: inline-block;
        pointer-events: auto;
        border: 1px solid var(--mint);
        color: var(--mint);
        padding: 14px 22px;
        border-radius: 999px;
        text-decoration: none;
      }
      .hint {
        color: var(--dim);
        position: relative;
        z-index: 5;
        padding-bottom: 64px;
      }
      .layer {
        position: absolute;
        inset: 0;
        display: none;
      }
      body[data-v="a"] .layer-a,
      body[data-v="b"] .layer-b,
      body[data-v="c"] .layer-c {
        display: block;
      }

      /* B: raio-x */
      body[data-v="b"] h1 {
        color: transparent;
        -webkit-text-stroke: 1px rgba(233, 236, 245, 0.28);
      }
      body[data-v="b"] h1 span {
        color: transparent;
      }
      .layer-b {
        -webkit-mask-image: radial-gradient(circle 260px at var(--mx) var(--my), #000 0 35%, transparent 100%);
        mask-image: radial-gradient(circle 260px at var(--mx) var(--my), #000 0 35%, transparent 100%);
        background:
          linear-gradient(rgba(92, 242, 176, 0.16) 1px, transparent 1px) 0 0 / 100% 32px,
          linear-gradient(90deg, rgba(92, 242, 176, 0.16) 1px, transparent 1px) 0 0 / 32px 100%,
          radial-gradient(circle at var(--mx) var(--my), #0f2a22, var(--deep));
        position: absolute;
        inset: 0;
        z-index: 6;
        pointer-events: none;
        padding: clamp(18px, 3vw, 36px);
        display: none;
        grid-template-rows: auto 1fr auto;
      }
      body[data-v="b"] .layer-b {
        display: grid;
      }
      .layer-b .ghost {
        visibility: hidden;
      }
      .layer-b h1 {
        color: var(--mint) !important;
        -webkit-text-stroke: 0 !important;
        align-self: center;
      }
      .layer-b h1 span {
        color: var(--ink) !important;
      }
      .log {
        position: absolute;
        inset: 0;
        padding: 12vh 4vw;
        columns: 3 260px;
        column-gap: 6vw;
        color: rgba(92, 242, 176, 0.5);
        line-height: 2.5;
        overflow: hidden;
        z-index: -1;
      }

      /* C: órbita */
      .layer-c {
        z-index: 4;
      }
      .system {
        position: absolute;
        right: -6vmin;
        top: 50%;
        width: 92vmin;
        height: 92vmin;
        transform: translateY(-50%) rotate(var(--rot, 0deg));
      }
      .ring {
        position: absolute;
        border: 1px solid rgba(233, 236, 245, 0.14);
        border-radius: 50%;
      }
      .core {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 13vmin;
        height: 13vmin;
        margin: -6.5vmin;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #fff3d6, var(--amber) 45%, #7a3d00);
        box-shadow: 0 0 80px 10px rgba(255, 181, 71, 0.45);
        z-index: 2;
      }
      .planet {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 0;
        height: 0;
        pointer-events: auto;
      }
      .planet i {
        position: absolute;
        width: 3.4vmin;
        height: 3.4vmin;
        margin: -1.7vmin;
        border-radius: 50%;
        background: var(--mint);
        box-shadow: 0 0 24px rgba(92, 242, 176, 0.7);
        transition: scale 0.2s;
      }
      .planet span {
        position: absolute;
        left: 3vmin;
        top: -1.2vmin;
        white-space: nowrap;
        color: var(--ink);
        opacity: 0.55;
        transition: opacity 0.2s;
      }
      .planet:hover i {
        scale: 1.7;
        background: var(--amber);
      }
      .planet:hover span {
        opacity: 1;
        color: var(--amber);
      }

      /* troca de variação */
      #switch {
        position: fixed;
        z-index: 20;
        left: 50%;
        bottom: 18px;
        translate: -50% 0;
        display: flex;
        gap: 6px;
        padding: 6px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(4, 5, 13, 0.8);
        backdrop-filter: blur(8px);
      }
      #switch button {
        border: 0;
        background: none;
        padding: 10px 14px;
        border-radius: 999px;
        color: var(--dim);
      }
      #switch button[aria-pressed="true"] {
        background: var(--ink);
        color: var(--void);
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      @media (max-width: 700px) {
        .top span:last-child {
          display: none;
        }
        .system {
          right: -30vmin;
          opacity: 0.75;
        }
      }
    </style>
  </head>
  <body data-v="a">
    <div id="gate">
      <div class="gate-box">
        <div id="count">03</div>
        <button id="ignite" class="mono">Ignição</button>
        <button id="skip" class="mono">Entrar sem contagem</button>
      </div>
    </div>

    <main id="hero">
      <div class="layer layer-a"><canvas id="warp"></canvas></div>
      <div class="layer layer-c">
        <div class="system" id="system"><div class="core"></div></div>
      </div>

      <div class="top mono">
        <span><b>●</b> Acelera Dev / Hub</span>
        <span>5 projetos · 3 autores · protótipo</span>
      </div>
      <div class="mid">
        <h1>Hub<br /><span>Acelera</span></h1>
        <p class="lede">O que a comunidade Acelera Dev construiu. E quem construiu.</p>
        <a class="cta mono" href="#">Ver projetos ↓</a>
      </div>
      <p class="hint mono" id="hint"></p>

      <div class="layer-b" aria-hidden="true">
        <div class="log mono" id="log"></div>
        <div class="top mono ghost"><span>.</span></div>
        <h1>Hub<br /><span>Acelera</span></h1>
        <p class="hint mono ghost">.</p>
      </div>
    </main>

    <nav id="switch" class="mono" aria-label="Variações do protótipo">
      <button data-v="a">1 · Dobra</button>
      <button data-v="b">2 · Raio-x</button>
      <button data-v="c">3 · Órbita</button>
    </nav>

    <script>
      const projects = [
        "Acelera Commits",
        "Resultados Acelera Dev",
        "Instablock",
        "Money Flow",
        "The One Digital",
      ];
      const hints = {
        a: "Mova o cursor para pilotar · mova rápido para acelerar",
        b: "Mova o cursor para iluminar o que a comunidade construiu",
        c: "Mova o cursor para inclinar a órbita · passe o mouse em um planeta",
      };
      const params = new URLSearchParams(location.search);
      const root = document.documentElement;
      const pointer = { x: 0.5, y: 0.5, speed: 0, last: 0 };

      function setVariant(v) {
        document.body.dataset.v = v;
        document.getElementById("hint").textContent = hints[v];
        for (const b of document.querySelectorAll("#switch button"))
          b.setAttribute("aria-pressed", String(b.dataset.v === v));
        params.set("v", v);
        history.replaceState(null, "", "?" + params.toString());
      }
      for (const b of document.querySelectorAll("#switch button"))
        b.addEventListener("click", () => setVariant(b.dataset.v));
      addEventListener("keydown", (e) => {
        const v = { 1: "a", 2: "b", 3: "c" }[e.key];
        if (v) setVariant(v);
      });
      setVariant(params.get("v") ?? "a");

      // tela de entrada
      const gate = document.getElementById("gate");
      const count = document.getElementById("count");
      const open = () => gate.classList.add("open");
      document.getElementById("skip").addEventListener("click", open);
      document.getElementById("ignite").addEventListener("click", () => {
        let n = 3;
        const tick = () => {
          count.textContent = String(n).padStart(2, "0");
          if (n-- === 0) return open();
          setTimeout(tick, 380);
        };
        tick();
      });
      if (params.has("open")) open();

      addEventListener("pointermove", (e) => {
        const x = e.clientX / innerWidth;
        const y = e.clientY / innerHeight;
        pointer.speed = Math.min(1, pointer.speed + Math.hypot(x - pointer.x, y - pointer.y) * 4);
        pointer.x = x;
        pointer.y = y;
        pointer.last = performance.now();
      });

      // B: registro por trás do título
      document.getElementById("log").innerHTML = Array.from({ length: 48 }, (_, i) => {
        const p = projects[i % projects.length];
        return `<div>[ ok ] ${String(i + 1).padStart(3, "0")} · ${p} · em órbita</div>`;
      }).join("");

      // C: planetas
      const system = document.getElementById("system");
      const planets = projects.map((name, i) => {
        const radius = 18 + i * 6.5;
        const ring = document.createElement("div");
        ring.className = "ring";
        ring.style.left = 50 - radius + "%";
        ring.style.width = radius * 2 + "%";
        system.append(ring);
        const el = document.createElement("div");
        el.className = "planet";
        el.innerHTML = `<i></i><span class="mono">${name}</span>`;
        system.append(el);
        const p = { el, ring, radius, angle: i * 1.9, rate: 0.5 / (1 + i * 0.45), paused: false };
        el.addEventListener("pointerenter", () => (p.paused = true));
        el.addEventListener("pointerleave", () => (p.paused = false));
        return p;
      });

      // A: campo de estrelas
      const canvas = document.getElementById("warp");
      const ctx = canvas.getContext("2d");
      const stars = Array.from({ length: 520 }, () => ({
        x: Math.random() * 2 - 1,
        y: Math.random() * 2 - 1,
        z: Math.random(),
      }));
      const center = { x: 0.5, y: 0.5 };
      function resize() {
        canvas.width = innerWidth * devicePixelRatio;
        canvas.height = innerHeight * devicePixelRatio;
      }
      addEventListener("resize", resize);
      resize();

      let then = performance.now();
      function frame(now) {
        const dt = Math.min(0.05, (now - then) / 1000);
        then = now;
        if (now - pointer.last > 2500) {
          pointer.x = 0.5 + Math.cos(now / 2600) * 0.22;
          pointer.y = 0.5 + Math.sin(now / 3400) * 0.18;
        }
        pointer.speed *= 0.94;
        root.style.setProperty("--mx", pointer.x * 100 + "%");
        root.style.setProperty("--my", pointer.y * 100 + "%");
        const v = document.body.dataset.v;

        if (v === "a") {
          center.x += (pointer.x - center.x) * 0.06;
          center.y += (pointer.y - center.y) * 0.06;
          const w = canvas.width;
          const h = canvas.height;
          const velocity = 0.12 + pointer.speed * 1.6;
          ctx.fillStyle = `rgba(4,5,13,${0.42 - pointer.speed * 0.28})`;
          ctx.fillRect(0, 0, w, h);
          for (const s of stars) {
            const z0 = s.z;
            s.z -= velocity * dt;
            if (s.z <= 0.02) {
              s.x = Math.random() * 2 - 1;
              s.y = Math.random() * 2 - 1;
              s.z = 1;
              continue;
            }
            const cx = center.x * w;
            const cy = center.y * h;
            const x0 = cx + (s.x / z0) * w * 0.5;
            const y0 = cy + (s.y / z0) * w * 0.5;
            const x1 = cx + (s.x / s.z) * w * 0.5;
            const y1 = cy + (s.y / s.z) * w * 0.5;
            ctx.strokeStyle = pointer.speed > 0.35 ? "rgba(92,242,176,.9)" : "rgba(233,236,245,.85)";
            ctx.lineWidth = (1 - s.z) * 2.4 * devicePixelRatio;
            ctx.beginPath();
            ctx.moveTo(x0, y0);
            ctx.lineTo(x1, y1 + 0.5);
            ctx.stroke();
          }
        }
        if (v === "c") {
          const rot = (pointer.x - 0.5) * 34;
          const tilt = 0.36 + (pointer.y - 0.5) * 0.34;
          system.style.setProperty("--rot", rot + "deg");
          const size = system.clientWidth / 100;
          for (const p of planets) {
            if (!p.paused) p.angle += p.rate * dt;
            p.ring.style.top = 50 - p.radius * tilt + "%";
            p.ring.style.height = p.radius * tilt * 2 + "%";
            const depth = Math.sin(p.angle);
            p.el.style.zIndex = depth > 0 ? 3 : 1;
            p.el.style.transform = `translate(${Math.cos(p.angle) * p.radius * size}px, ${depth * p.radius * tilt * size}px) rotate(${-rot}deg) scale(${0.8 + depth * 0.25})`;
          }
        }
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
